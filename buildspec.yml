version: 0.2
phases:
  install:
    commands:
      - echo Installing dependencies...
  build:
    commands:
      - echo Build started on `date`
      - echo Copying files...
  post_build:
    commands:
      - echo Build completed successfully
artifacts:
  files:
    - index.html
    - main.js
    - styles.css
    - image.jpg
    - appspec.yml
    - scripts/**/*
  discard-paths: no